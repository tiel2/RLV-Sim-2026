# Research-demo sensor and navigation parameters (assumed, not flight specifications).
imu_rate_hz: 100.0             # must match scenario.horizon.nav_dt; runner never overrides timing
imu_accel_sigma: 0.08           # m/s^2 per nav sample
imu_gyro_sigma_deg: 0.025      # deg/s per nav sample
accel_bias: [0.025, -0.02, 0.035]  # m/s^2 fixed injected truth bias
gyro_bias_deg: [0.005, -0.006, 0.004] # deg/s fixed injected bias
gnss_pos_sigma: 2.5             # m, per axis
gnss_vel_sigma: 0.15            # m/s, per axis
gnss_dropout: 0.03             # Bernoulli loss per scheduled measurement
gnss_period: 0.1               # seconds, 10 Hz
radar_sigma: 0.5                # m
radar_period: 0.05             # seconds, 20 Hz
radar_range: 1500.0            # radial height on rotating Earth, flat height in fixed mode
gnss_outage_start: -1.0         # set both e.g. 65 and 75 for outage test
gnss_outage_end: -1.0
seed_offset: 0
# Optional mismatch/outlier experiments; nominal report settings keep these disabled.
accel_scale_factor: [0.0, 0.0, 0.0]
gyro_scale_factor: [0.0, 0.0, 0.0]
accel_bias_random_walk: 0.0
gyro_bias_random_walk_deg: 0.0
gnss_outlier_times: []
gnss_outlier_position_m: [100.0, -100.0, 50.0]
gnss_outlier_velocity_mps: [10.0, -10.0, 5.0]
gnss_gate_threshold: null    # optional NIS gate, e.g. 16.812 for six dimensions
radar_gate_threshold: null   # optional NIS gate, e.g. 6.635 for one dimension
alignment_sigma_deg: 1.0       # one independent uncertain preflight/handoff attitude observation
alignment_error_deg: [0.0, 0.0, 0.0] # additional deterministic stress offset, reference axes
prior_position_sigma: 25.0     # m; declared handoff prior if initial GNSS is unavailable
prior_velocity_sigma: 2.0      # m/s
prior_position_offset: [0.0, 0.0, 0.0] # relative to configured nominal IC, never realized truth
prior_velocity_offset: [0.0, 0.0, 0.0]
gyro_bias_rw_deg: 0.0005
accel_bias_rw: 0.0005
law:
  _target_: gnc.navigation.synthetic_eskf.build
