# Specification/optional reference-analysis recipe; not a runnable Hydra scenario.
# Experiment and burn durations are engineering choices, independent of reference event windows.
reference:
  dataset: crs11
  max_gap_s: 1.1
  derivative_spans_s:
  - 2.0
  - 4.0
  - 6.0
  nominal_span_s: 4.0
  polynomial_degree: 2
  component_tolerance_mps: 0.01
recovery_overrides:
