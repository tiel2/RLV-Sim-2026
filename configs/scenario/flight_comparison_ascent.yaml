# @package _global_
# Generated by scripts/prepare_flight_scenarios.py; unfitted.
defaults:
- project2_ascent
- _self_
scenario:
  name: flight_comparison_ascent
  description: Independent CRS-11 reconstruction, unfitted
  ic:
    r_ned:
    - 0.0
    - 0.0
    - -0.0
    v_ned:
    - 0.0
    - 0.0
    - 0.0
    roll_deg: 0.0
    pitch_deg: 90.0
    yaw_deg: 45.0
    w_body:
    - 0.0
    - 0.0
    - 0.0
    m: 545200.0
    rcs_fuel: 200.0
    throttle0: 1.0
    launch_pad: true
  horizon:
    t_max: 145.0
  reference:
    enabled: true
    dataset: crs11
    segment: ascent
    policy: crs11_observations_v1
    policy_path: configs/analysis/public_flight_comparison.yaml
    start_s: 0.0
    end_s: 145.0
    time_offset_s: -0.0
    altitude_offset_m: 0.0
    exclude_initial_sample: true
    conventions: Provisional equal radial-altitude datum and Earth-relative scalar
      speed
    role: observation_informed_uncalibrated_reconstruction
  reconstruction:
    policy_version: 1
    provenance:
      altitude: bracketed webcast altitude; pad zero is an engineering condition
      scalar_speed: bracketed webcast speed under Earth-relative frame assumption
      velocity_components: trailing altitude derivative and assumed heading; pad at
        rest
      position_heading_attitude_rates: assumed origin, heading, alignment and zero
        rates
      mass_propellant_actuators: authored independent budgets and actuator initial
        state
      inputs: authored commands or LCvx/PD; actual flight inputs unavailable
      landing_target: initial ground projection, engineering target, not measured
        LZ-1
    initialization_use_range_s:
    - 0.0
    - 0.0
    future_parameters:
    - name: initial_mass_kg
      paths:
      - scenario.ic.m
      initial: 545200.0
      bounds:
      - 520000.0
      - 545200.0
      constraint: tank/wet/fuel checks required
    - name: throttle_knot_0
      paths:
      - scenario.inputs.0.throttle
      initial: 1.0
      bounds:
      - 0.4
      - 1.0
    - name: pitch_kick_rad
      initial: 0.002
      bounds:
      - -0.01
      - 0.01
      paths:
      - scenario.inputs.1.gimbal.0.0
      - scenario.inputs.1.gimbal.1.0
      - scenario.inputs.1.gimbal.2.0
      - scenario.inputs.1.gimbal.3.0
      - scenario.inputs.1.gimbal.4.0
      - scenario.inputs.1.gimbal.5.0
      - scenario.inputs.1.gimbal.6.0
      - scenario.inputs.1.gimbal.7.0
      - scenario.inputs.1.gimbal.8.0
    - name: throttle_knot_3
      paths:
      - scenario.inputs.3.throttle
      initial: 0.8
      bounds:
      - 0.4
      - 1.0
    - name: throttle_knot_4
      paths:
      - scenario.inputs.4.throttle
      initial: 1.0
      bounds:
      - 0.4
      - 1.0
  inputs:
  - t: 0.0
    label: ascent
    throttle: 1.0
    fin_deployment: 0.0
  - t: 10.0
    label: pitch_kick
    gimbal:
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
    - - 0.002
      - 0
  - t: 12.0
    label: gravity_turn
    gimbal: 0.0
  - t: 50.0
    label: throttle_down
    throttle: 0.8
  - t: 74.0
    label: full_thrust
    throttle: 1.0
