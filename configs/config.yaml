# Falcon 9 6-DOF plant — single-engine landing configuration by default.
defaults:
  - plant/vehicle: falcon9_stage1
  - plant/aero: table
  - plant/slosh: none
  - plant/actuator: realistic
  - plant/thrust: backpressure
  - plant/rcs: paired
  - environment/gravity: inverse_square
  - environment/atmosphere: ussa_poly
  - environment/wind: none
  - environment/earth: fixed
  - fault: none
  - gnc/scheduler: altitude
  - gnc/guidance: lcvx
  - gnc/control: pd
  - gnc/allocation: default
  - gnc/navigation: identity
  - run: single
  - vehicle_set: falcon9
  - scenario: pdg
  - _self_

seed: 0
plant_dt: 0.001 # RK4 fixed step [s]; larger steps require a timestep-convergence check

gnc:
  delay_ticks: 0 # GNC transport delay [ctrl ticks] — loop-level, shared by all gnc modules

# Output dir: results/<script>/<date>/<time>; resolved config + seed saved.
hydra:
  job:
    chdir: true # cwd -> the run dir (Hydra 1.2+ defaults this off)
  run:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: results/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
